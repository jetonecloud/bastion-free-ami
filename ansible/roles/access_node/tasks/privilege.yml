---
# Interactive sessions must not run as root, and must not be able to
# become root without a separate, auditable grant.
#
# Session Manager never authenticates as root -- AWS does not support it
# ("Session Manager does not support using an operating system's root user
# account to authenticate connections"). The real risk is the passwordless
# sudo that SSM Agent grants ssm-user, which makes the distinction
# cosmetic.

- name: Ensure /etc/sudoers.d exists with correct permissions
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    owner: root
    group: root
    mode: "0750"

# SSM Agent creates ssm-user on first session, which on a freshly baked
# AMI is after this build. It writes /etc/sudoers.d/ssm-agent-users at
# that point only if the file is absent -- so pre-creating it with the
# comment-only content AWS documents is what makes the removal stick.
- name: Pre-create ssm-agent-users sudoers file with no privilege grant
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ssm-agent-users
    content: |
      # User rules for ssm-user
      #
      # Deliberately empty. SSM Agent would otherwise write
      #   ssm-user ALL=(ALL) NOPASSWD:ALL
      # here when it creates the account, giving every Session Manager
      # user instant root on the one host the whole team can reach.
      #
      # This file is pre-created at AMI build time by
      # ansible/roles/access_node (bastion-free-ami) using the removal
      # procedure AWS documents at:
      #   systems-manager/latest/userguide/
      #     session-manager-getting-started-ssm-user-permissions.html
      #
      # To obtain elevated access, do NOT edit this file. Use a separate
      # IAM role tagged SSMSessionRunAs=<privileged-os-user>, which is
      # independently auditable in CloudTrail. See docs/access-paths.md.
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when: access_node_strip_ssm_user_sudo | bool

# If a previous image already created ssm-user with sudo, remove the
# grant rather than assuming a fresh build.
- name: Check whether ssm-user already exists
  ansible.builtin.getent:
    database: passwd
    key: ssm-user
    fail_key: false
  register: access_node_ssm_user

- name: Remove ssm-user from any privileged group it may have inherited
  ansible.builtin.user:
    name: ssm-user
    groups: ""
    append: false
  when:
    - access_node_strip_ssm_user_sudo | bool
    - access_node_ssm_user.ansible_facts.getent_passwd['ssm-user'] is defined

- name: Find any other sudoers drop-in granting ssm-user privileges
  ansible.builtin.find:
    paths: /etc/sudoers.d
    patterns: "*"
    contains: '^\s*ssm-user\s+ALL'
  register: access_node_ssm_sudo_grants

# A stray grant in another drop-in would silently undo the file above.
# Fail the build rather than publish an AMI where every session is root.
- name: Fail if another sudoers drop-in grants ssm-user privileges
  ansible.builtin.fail:
    msg: >-
      These sudoers drop-ins grant ssm-user privileges and would undo the
      unprivileged-session guarantee:
      {{ access_node_ssm_sudo_grants.files | map(attribute='path') | list }}.
      Remove the grant or set access_node_strip_ssm_user_sudo=false and
      document why.
  when:
    - access_node_strip_ssm_user_sudo | bool
    - access_node_ssm_sudo_grants.matched > 0
